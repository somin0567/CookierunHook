name: YouTube Discord Notifier

on:
  schedule:
    - cron: '5 0-13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm install
      
      - name: 모니터링 실행
        run: npx tsx src/scripts/YoutubeMonitor.ts
        env:
          VITE_DISCORD_WEBHOOK_URL: ${{ secrets.VITE_DISCORD_WEBHOOK_URL }}
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add src/scripts/last_id.txt
          git commit -m "chore: update last notified youtube id" || exit 0
          git push
